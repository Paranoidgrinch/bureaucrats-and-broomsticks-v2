name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0-beta.1
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller==6.21.0

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: .\scripts\build_windows_release.ps1 -PythonExecutable python

      - name: Preserve build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bureaucrats-and-Broomsticks-Windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Ensure GitHub CLI is available
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
              choco install gh -y
          }
          gh --version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          $notes = @(
              "## Bureaucrats and Broomsticks beta",
              "",
              "Download **Bureaucrats-and-Broomsticks-Windows-x64.zip**, extract the complete ZIP, and start **Bureaucrats-and-Broomsticks.exe**.",
              "",
              "No Python installation is required.",
              "",
              'This is a terminal-based playable beta. Keep the executable together with the included `_internal` folder.'
          ) -join "`n"

          [System.IO.File]::WriteAllText(
              $notesPath,
              $notes,
              [System.Text.UTF8Encoding]::new($false)
          )

          $arguments = @(
              "release",
              "create",
              $env:RELEASE_TAG,
              "artifacts/Bureaucrats-and-Broomsticks-Windows-x64.zip",
              "artifacts/Bureaucrats-and-Broomsticks-Windows-x64.zip.sha256",
              "--target",
              $env:GITHUB_SHA,
              "--title",
              "Bureaucrats and Broomsticks $env:RELEASE_TAG",
              "--notes-file",
              $notesPath
          )

          if ($env:IS_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
